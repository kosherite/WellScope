# One company, every way the regulators spell it.
#
# Each entry: ticker (exchange symbol, or leave blank for private companies), the display name, and aliases.
# Matching ignores case, punctuation and suffixes like Ltd., Inc., Corp., ULC, so "TOURMALINE OIL CORP." and
# "Tourmaline Oil Corp" already match "Tourmaline Oil Corp." without being listed.
# BC well names start with a short operator name ("CNRL HZ ALTARES"); list those short names as aliases.
#
# Every pipeline run writes site/data/unmatched_companies.json: the biggest names that aren't in this file yet.
# Add them here (or open a pull request) to merge them.

