<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WellScope</title>
<meta name="description" content="Every oil and gas well in Alberta, Saskatchewan, BC and Manitoba on one free map. Search any UWI, licence, legal location or operator.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#14213d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="map" aria-label="Map of oil and gas wells"></div>

<header class="bar">
  <a class="brand" href="#" title="WellScope"><svg class="mark" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4H3.7M8.3 4H22" stroke-width="1.2" opacity=".55"/><path d="M6 6.4V9C6 13 8 15 11 15H21.5M12 15L15 11.5M12 15L15 18.5M16.5 15L19.5 11.5M16.5 15L19.5 18.5"/><circle cx="6" cy="4" r="2.3" fill="#f0b54a" stroke="none"/></svg><span>WellScope</span></a>
  <div class="search" role="search">
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Location, Company, Ticker, or UWI" aria-label="Search wells">
    <div id="suggest" class="suggest" hidden></div>
  </div>
  <button class="iconbtn" id="layersBtn" type="button" aria-expanded="false" aria-controls="layers" title="Layers">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Zm-8.2 9.1L2 13l10 5 10-5-1.8-.9L12 16.1 3.8 12.1Zm0 4L2 17l10 5 10-5-1.8-.9L12 20.1 3.8 16.1Z" fill="currentColor"/></svg>
  </button>
</header>

<div id="opFilter" class="filterchip" hidden></div>

<aside id="layers" class="layers" hidden>
  <div class="row"><b>Base map</b></div>
  <div class="seg" id="basemaps">
    <button data-b="light">Map</button><button data-b="sat">Satellite</button><button data-b="topo" class="on">Topo</button>
  </div>
  <label class="check"><input type="checkbox" id="gridT" checked> Township &amp; section grid</label>
  <label class="check"><input type="checkbox" id="latT" checked> Horizontal laterals</label>
  <label class="check"><input type="checkbox" id="actT"> New activity, last 90 days <small class="muted" id="actCount"></small></label>
  <div class="actkey"><span><i class="ring"></i>Licence issued</span><span><i class="fill"></i>Drilling started</span></div>
  <div class="row" style="margin-top:6px"><b>Units</b></div>
  <div class="seg two" id="unitSys"><button data-v="metric">Metric (m³, e³m³)</button><button data-v="imperial">Imperial (bbl, mcf)</button></div>
  <div class="seg two" id="unitPer"><button data-v="day">Per day</button><button data-v="month">Per month</button></div>
  <div class="row" style="margin-top:6px"><b>Wells</b><span class="muted" id="wellCount"></span></div>
  <div id="legend" class="legend"></div>
  <div class="legendbtns"><button class="link" id="legendReset" type="button">Producing only</button><button class="link" id="legendAll" type="button">Show all</button></div>
  <p class="fine">Grid lines are drawn from the survey formula and can be a few hundred metres off. Well positions use surveyed coordinates where the regulator publishes them.</p>
  <button class="link" id="aboutBtn" type="button">About this data</button>
</aside>

<aside id="panel" class="panel" hidden aria-live="polite"></aside>

<div id="about" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="aboutTitle"><div class="sheet"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script src="units.js"></script>
<script src="locate.js"></script>
<script src="app.js"></script>
<script src="company.js"></script>
</body>
</html>
