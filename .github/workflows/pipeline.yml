name: Build basin data and publish site

on:
  push:
    branches: [pipeline-test]       # test builds: run everything except the deploy
  schedule:
    - cron: "17 9 22 * *"          # monthly, after Petrinex and the provinces post the prior month
  workflow_dispatch:
    inputs:
      provinces:
        description: "Provinces to load"
        default: "AB,SK,BC,MB"
      months:
        description: "Months of production history"
        default: "36"
      probe_only:
        description: "Only print each source's columns (no build)"
        type: boolean
        default: false

permissions:
  contents: write        # to push screenshots of the built site to the ci-screenshots branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Restore tippecanoe
        id: tc
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe
          key: tippecanoe-2.82.0-${{ runner.os }}

      - name: Build tippecanoe (makes the map tiles)
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -q libsqlite3-dev zlib1g-dev
          git clone -q --depth 1 --branch 2.82.0 https://github.com/felt/tippecanoe.git /tmp/tc
          make -C /tmp/tc -j4 >/dev/null
          mkdir -p ~/tippecanoe && cp /tmp/tc/tippecanoe ~/tippecanoe/

      - name: Probe sources (column check)
        run: python -m wellscope probe || echo "::warning::One or more sources failed the probe; see log above"

      - name: Build
        if: ${{ !inputs.probe_only }}
        run: |
          free -h; df -h . | tail -1
          export TIPPECANOE=~/tippecanoe/tippecanoe
          python -m wellscope run \
            --provinces "${{ inputs.provinces || 'AB,SK,BC,MB' }}" \
            --months "${{ inputs.months || '36' }}" \
            --out site/data --parquet data/build --allow-partial
          du -sh site/data site/data/wells.pmtiles site/data/twp

      - name: Screenshot the built site
        if: ${{ !inputs.probe_only }}
        continue-on-error: true
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          python scripts/rangeserve.py site 8000 & sleep 2
          python scripts/ci_screenshots.py http://127.0.0.1:8000 /tmp/shots
          cd /tmp/shots && git init -q && git checkout -q -b ci-screenshots
          git -c user.name="wellscope-ci" -c user.email="ci@users.noreply.github.com" add -A
          git -c user.name="wellscope-ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Screenshots from run ${{ github.run_id }} (${{ github.ref_name }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Keep the site data for website-only deploys
        if: ${{ !inputs.probe_only }}
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: site/data
          retention-days: 90

      - name: Keep the processed tables
        if: ${{ !inputs.probe_only }}
        uses: actions/upload-artifact@v4
        with:
          name: wellscope-tables
          path: data/build
          retention-days: 30

      - uses: actions/configure-pages@v5
        if: ${{ !inputs.probe_only && github.ref == 'refs/heads/main' }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.probe_only && github.ref == 'refs/heads/main' }}
        with:
          path: site

  deploy:
    if: ${{ !inputs.probe_only && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
