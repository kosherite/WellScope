name: Publish website

# The only workflow that publishes the website. Two versions go out together on every publish:
#   https://kosherite.github.io/WellScope/          live   = the main branch
#   https://kosherite.github.io/WellScope/staging/  test   = the staging branch
# Both read the same map data (the latest successful data build), so a front-end change can be tried on
# /staging/ against real data, then promoted by merging staging into main.
# Runs after CI passes on main or staging, after a data build on main, or by hand.
on:
  workflow_run:
    workflows: ["CI", "Build basin data and publish site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        (github.event.workflow_run.name == 'CI' && github.event.workflow_run.head_branch == 'staging')))
    # concurrency on the job, not the workflow: runs that are skipped above must not take the queue slot
    # (a skipped run used to replace a waiting real publish)
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add the staging version under /staging/
        run: |
          if git fetch -q --depth 1 origin staging; then
            mkdir -p /tmp/stg && git archive FETCH_HEAD site | tar -x -C /tmp/stg
            rm -rf /tmp/stg/site/data site/staging && mv /tmp/stg/site site/staging
            # staging reads the live data one folder up, and stays out of search engines
            sed -i 's#<head>#<head>\n<meta name="wellscope-data" content="../data/">\n<meta name="robots" content="noindex">#' site/staging/index.html
            echo "::notice title=Staging::published staging $(git rev-parse --short FETCH_HEAD) at /staging/"
          else
            echo "No staging branch yet"
          fi
      - name: Use the latest full dataset if there is one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --workflow pipeline.yml --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$id" ] && gh run download "$id" -n site-data -D /tmp/site-data; then
            rm -rf site/data && mv /tmp/site-data site/data && echo "::notice title=Data::using data from pipeline run $id"
          else
            echo "No pipeline data yet; publishing the committed pilot snapshot"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
